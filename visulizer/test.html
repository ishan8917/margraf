<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wall Studio | CSS Layering</title>
    <style>
        :root { --panel: #161618; --accent: #c9a96e; --text: #f0ede8; }
        body { margin: 0; background: #000; font-family: sans-serif; display: flex; height: 100vh; }

        /* VIEWPORT: The container for the layers */
        .viewport { 
            flex: 1; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        .visualizer-container {
            position: relative;
            width: 90%;
            aspect-ratio: 16 / 9; /* Ensure this matches your image ratio */
        }

        /* LAYER 1: The background tile (Underneath) */
        #tile-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 300px; /* Adjust tile size here */
            background-repeat: repeat;
            z-index: 1;
        }

        /* LAYER 2: The transparent room PNG (On Top) */
        .room-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('room_transparent.png'); /* YOUR TRANSPARENT PNG */
            background-size: cover;
            z-index: 2;
            pointer-events: none; /* Allows clicks to pass through if needed */
        }

        /* SIDEBAR STYLING */
        .sidebar { width: 350px; background: var(--panel); color: var(--text); padding: 20px; }
        .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .tile-card { 
            border: 2px solid transparent; 
            border-radius: 8px; 
            cursor: pointer; 
            overflow: hidden; 
            background: #222;
        }
        .tile-card.active { border-color: var(--accent); }
        .swatch { height: 80px; background-size: cover; }
        .label { padding: 10px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="visualizer-container">
            <div id="tile-background"></div>
            <div class="room-overlay"></div>
        </div>
    </div>

    <div class="sidebar">
        <h2 style="color:var(--accent)">WALL STUDIO</h2>
        <p style="font-size: 12px; color: #888;">Click a tile to update the wall</p>
        
        <div class="tile-grid">
            <div class="tile-card" onclick="updateWall(this, 'travertino-navona-e1691490697537.jpg')">
                <div class="swatch" style="background-image: url('travertino-navona-e1691490697537.jpg');"></div>
                <div class="label">TRAVERTINO NAVONA</div>
            </div>
            
            <div class="tile-card" onclick="updateWall(this, 'nero.jpg')">
                <div class="swatch" style="background-image: url('nero.jpg');"></div>
                <div class="label">NERO PORTORO</div>
            </div>
        </div>
    </div>

    <script>
        function updateWall(element, imageUrl) {
            // Update the background layer
            document.getElementById('tile-background').style.backgroundImage = `url('${imageUrl}')`;
            
            // Handle Active UI state
            document.querySelectorAll('.tile-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }

        // Default selection on load
        window.onload = () => {
            const firstTile = document.querySelector('.tile-card');
            if(firstTile) firstTile.click();
        };
    </script>
</body>
</html>
